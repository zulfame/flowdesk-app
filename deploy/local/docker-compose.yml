# ============================================================
# FlowDesk — Local Development (Docker Compose)
# React (hot reload) + FastAPI (hot reload) + MongoDB + Mongo Express
#
# Semua PORT & NAMA RESOURCE dapat dikonfigurasi lewat .env agar
# tidak bentrok dengan project Emergent lain di mesin yang sama:
#   COMPOSE_PROJECT_NAME  -> prefiks unik container/volume/network
#   FRONTEND_PORT / BACKEND_PORT / MONGO_PORT / MONGO_EXPRESS_PORT
#
# Jalankan dari folder deploy/local: ./start.sh
# ============================================================
services:
  # ---------- MongoDB (data persisten via volume) ----------
  mongodb:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-flowdesk}_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks: [flowdesk_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Mongo Express (GUI database) ----------
  mongo-express:
    image: mongo-express:latest
    container_name: ${COMPOSE_PROJECT_NAME:-flowdesk}_mongo_express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASS:-admin}
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [flowdesk_net]

  # ---------- Backend FastAPI (hot reload via --reload) ----------
  backend:
    build:
      context: ../..
      dockerfile: deploy/local/flowdesk.backend
    image: ${COMPOSE_PROJECT_NAME:-flowdesk}/backend:local
    container_name: ${COMPOSE_PROJECT_NAME:-flowdesk}_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-flowdesk}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@flowdesk.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      # Mount source code agar hot reload bekerja
      - ../../backend:/app/backend
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [flowdesk_net]

  # ---------- Frontend React craco (hot reload) ----------
  frontend:
    build:
      context: ../..
      dockerfile: deploy/local/flowdesk.frontend
    image: ${COMPOSE_PROJECT_NAME:-flowdesk}/frontend:local
    container_name: ${COMPOSE_PROJECT_NAME:-flowdesk}_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # URL backend yang diakses BROWSER (host), ikut BACKEND_PORT terpilih
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
      # Polling diperlukan agar file-watcher bekerja di dalam container
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "${FRONTEND_PORT:-3000}"
    volumes:
      # Mount source code agar hot reload bekerja (node_modules tetap milik container)
      - ../../frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on: [backend]
    networks: [flowdesk_net]

volumes:
  mongo_data:
    # Nama volume di-namespace agar tiap project punya data terpisah
    name: ${COMPOSE_PROJECT_NAME:-flowdesk}_mongo_data

networks:
  flowdesk_net:
    name: ${COMPOSE_PROJECT_NAME:-flowdesk}_net
    driver: bridge
